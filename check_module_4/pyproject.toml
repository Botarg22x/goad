[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authchecker"
version = "0.1.0"
description = "Offline-safe orchestration core for credential checks against PointFinder 2.0 reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Diploma project"}]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
authchecker = "authchecker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authchecker = ["data/*.txt"]

