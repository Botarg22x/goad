[project]
name = "password-generator"
version = "0.2.0"
description = "Password candidate generator for credential brute-force resistance assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
passgen = "password_generator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["passgen"]

[tool.setuptools.packages.find]
where = ["."]
include = ["password_generator*"]

[tool.setuptools.package-data]
password_generator = ["help/*.yaml"]
