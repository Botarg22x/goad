# config_template.yaml — копируемый и исполняемый шаблон для passgen.
#
# Этот файл уже можно запускать: сейчас он создаёт 100 вариантов вида
# Password00! ... Password99! в outputs/template_candidates.txt.
#
# Быстрый порядок работы:
#   1. Скопируйте файл:  cp config_template.yaml my_passgen.yaml
#   2. Измените один из рецептов ниже (patterns, при необходимости wordlists).
#   3. Проверьте без записи: passgen from-config my_passgen.yaml --check
#   4. Посмотрите количество: passgen from-config my_passgen.yaml --plan
#   5. Сгенерируйте:          passgen from-config my_passgen.yaml --yes --stats
#
# Всё после # — комментарий: программа это не читает. Альтернативные рецепты
# ниже полностью закомментированы. Включайте только нужный рецепт и не оставляйте
# два одинаковых ключа YAML (например, два блока patterns или wordlists).
#
# Пути к словарям, rule-файлам и output внутри YAML считаются от папки этого
# YAML-файла. Если перенести my_passgen.yaml в configs/, путь к словарю станет
# ../dictionaries/names.txt. Значение -o / --output в командной строке, напротив,
# считается от папки, в которой открыт терминал.
#
# YAML здесь строгий: булевы значения пишутся только true/false, числа не нужно
# брать в кавычки, а имена полей нельзя придумывать. Сначала всегда запускайте
# --check и --plan: маски, два словаря и мутации способны дать очень много строк.

# Версия формата конфигурации. Сейчас поддерживается только целое число 2.
version: 2

# Список паттернов, по которым строятся кандидаты. Хотя бы один обязателен.
patterns:
  # ?d означает одну цифру. Два ?d дают 100 вариантов: от 00 до 99.
  - "Password?d?d!"

# Куда и как записывать результат. Этот блок можно не писать: тогда будут
# candidates.txt, UTF-8 и объединение с уже существующим файлом.
output:
  # Относительный путь к обычному текстовому файлу; "-" выводит строки в терминал.
  path: outputs/template_candidates.txt
  # Кодировка файла результата. Подходит любая текстовая кодировка Python.
  encoding: utf-8
  # false объединяет новые строки со старым output без дубликатов; true заменяет его.
  overwrite: false

# -----------------------------------------------------------------------------
# РЕЦЕПТ 1. Только маска (без словарей)
# -----------------------------------------------------------------------------
# Замените текущий блок patterns на один из вариантов ниже.
#
# patterns:
#   - "?u?l?l?d?d?d"               # Заглавная, две строчные и три цифры.
#   - "user_?d?d"                  # Литерал user_ и две цифры.
#   - "mail??{{test}}"             # ??, {{ и }} выводят буквальные ?, { и }.
#   - "?{cyrillic_upper}?d"        # Русская заглавная буква и цифра.
#
# Встроенные наборы символов:
#   ?l — a-z; ?u — A-Z; ?d — 0-9; ?s — пробел и ASCII-спецсимволы.
#   ?a — все печатные ASCII-символы; ?h/?H — hex в нижнем/верхнем регистре.
#   ?{cyrillic_lower} и ?{cyrillic_upper} — русские буквы.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 2. Один словарь
# -----------------------------------------------------------------------------
# 1) Раскомментируйте wordlists и 2) замените patterns на "{common}".
# Имя common из блока wordlists используется в паттерне как {common}.
#
# wordlists:
#   common:
#     path: dictionaries/demo.txt    # Текстовый файл: одна строка = одно слово.
#     encoding: utf-8                # Кодировка словаря; по умолчанию utf-8.
#     max_lines: all                 # all — читать весь файл; можно указать 100.
#     min_length: 4                  # Не брать слова короче 4 символов.
#     max_length: 20                 # Не брать слова длиннее 20 символов.
#     require: [lowercase]           # В слове обязана быть каждая категория.
#     forbid: [digits, special]      # В слове не должно быть этих категорий.
#
# patterns:
#   - "{common}"                    # Каждое подходящее слово без дополнений.
#
# В require/forbid разрешены только: digits, lowercase, uppercase, special.
# Одну и ту же категорию нельзя одновременно написать в require и forbid.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 3. Гибрид: словарь + маска
# -----------------------------------------------------------------------------
# Сначала подключите словарь common из рецепта 2, затем используйте:
#
# patterns:
#   - "{common}?d?d"                # Каждое слово × 100 комбинаций цифр.
#   - "pre_{common}_?u"             # Литералы, слово и одна заглавная буква.
#
# Например, для слова admin первый вариант даст admin00 ... admin99.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 4. Два разных словаря: полное декартово произведение
# -----------------------------------------------------------------------------
# Здесь каждая строка names сочетается с каждой строкой years. Перед запуском
# посмотрите --plan: N имён и M лет дают N × M кандидатов на один паттерн.
#
# wordlists:
#   names:
#     path: dictionaries/names.txt   # Словарь имён.
#     encoding: utf-8                # Кодировка словаря.
#     max_lines: all                 # Можно ограничить, например, 50.
#   years:
#     path: dictionaries/years.txt   # Словарь лет или чисел.
#     encoding: utf-8                # Кодировка словаря.
#     max_lines: all                 # Читать все строки.
#
# patterns:
#   - "{names}_{years}"             # names × years: ivan_2024, admin_2026, ...

# -----------------------------------------------------------------------------
# РЕЦЕПТ 5. Повтор одного словаря — то же выбранное слово дважды
# -----------------------------------------------------------------------------
# Подключите names из рецепта 4 и замените patterns:
#
# patterns:
#   - "{names}_{names}"             # admin_admin, ivan_ivan; НЕ admin_ivan.
#
# В отличие от двух разных имён словарей, одинаковое имя связывается один раз.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 6. Собственные наборы символов (charsets)
# -----------------------------------------------------------------------------
# ?1 ... ?4 — короткая форма для наборов с ключами "1" ... "4".
# ?{vowels} — форма для именованного набора. Повторы символов удаляются.
# Для паттернов с {common} также подключите common из рецепта 2.
#
# charsets:
#   "1": "йцук"                    # Набор для токена ?1.
#   vowels: "aeiou"                  # Набор для токена ?{vowels}.
#   safe_symbols: "_-"               # Набор для токена ?{safe_symbols}.
#
# patterns:
#   - "?1?1{common}"                # Две позиции из ?1 и слово common.
#   - "{common}?{vowels}?d"         # Слово, гласная и цифра.
#   - "?{safe_symbols}?u?d"         # Один из _/-, заглавная и цифра.
#
# Пользовательский charset не может быть пустым и не может переопределить
# встроенное имя (l, u, d, s, a, h, H и другие встроенные имена).

# -----------------------------------------------------------------------------
# РЕЦЕПТ 7. Мутации для выбранного паттерна
# -----------------------------------------------------------------------------
# Мутация превращает один базовый кандидат в дополнительные варианты.
# Подключите common из рецепта 2, затем включите блок mutations и mapping-форму
# паттерна. apply_mutations: true действует только на этот паттерн.
#
# mutations:
#   mode: independent                 # Каждое правило применяется к исходной строке.
#   include_original: true            # Сохранить исходную строку вместе с мутациями.
#   default_apply: false              # Не применять мутации к обычным строкам patterns.
#   rules:
#     - type: capitalize_first        # admin -> Admin.
#     - type: append                  # Добавить текст в конец.
#       value: "2026"                 # Значение для append/prepend обязательно.
#     - type: replace                 # Заменить все вхождения символа или строки.
#       from: "a"                     # Что заменить; пустая строка запрещена.
#       to: "@"                       # На что заменить; пустая строка разрешена.
#     # Допустимы также: prepend, uppercase, uppercase_all, lowercase,
#     # lowercase_all, reverse, ru_to_eng, url_encode_specials, base64_encode.
#   rule_files:                       # Правила из hashcat-совместимого файла.
#     - path: rules/demo.rule         # В проекте есть небольшой рабочий пример.
#       encoding: utf-8               # Кодировка rule-файла.
#       max_rules: 2                  # all или положительное число правил.
#
# patterns:
#   - value: "{common}"              # Сам базовый паттерн.
#     apply_mutations: true           # Применить mutations только здесь.
#   - "{common}?d"                   # Не мутируется: default_apply выше false.
#
# Для последовательной цепочки замените mode на chained: результат первого
# правила станет входом второго, а выдаётся итог цепочки. rule_files поддерживает
# только подмножество синтаксиса hashcat; список операций приведён в README.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 8. Глобальные фильтры готовых кандидатов
# -----------------------------------------------------------------------------
# Фильтры выполняются ПОСЛЕ разворачивания паттерна и мутаций. Они уменьшают
# итоговый output, но не уменьшают количество вариантов в предварительном плане.
#
# result_filters:
#   min_length: 8                     # Отбросить строки короче 8 символов.
#   max_length: 64                    # Отбросить строки длиннее 64 символов.
#   require: [digits, lowercase]      # Оставить только строки с обеими категориями.
#   forbid: [special]                 # Отбросить строки с любой указанной категорией.
#   forbid_control_characters: true   # Отбросить ASCII U+0000–U+001F и U+007F; true по умолчанию.
#   # NUL, CR и LF запрещены всегда; Unicode C1 U+0080–U+009F не фильтруются.
#
# min_length и max_length — положительные числа, min_length не больше max_length.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 9. Подтверждение большого запуска
# -----------------------------------------------------------------------------
# generation:
#   confirm_above: 1000000            # Спросить подтверждение, если план больше числа.
#
# Значение 0 заставляет подтверждать любой непустой план. Точная дедупликация
# всегда включена, поэтому generation.deduplicate писать нельзя.

# -----------------------------------------------------------------------------
# РЕЦЕПТ 10. Другой способ вывода и режим перезаписи
# -----------------------------------------------------------------------------
# output:
#   path: "-"                         # Печатать кандидаты в stdout вместо файла.
#   encoding: utf-8                   # Кодировка потока stdout.
#   overwrite: false                  # Для stdout это поле несущественно.
#
# output:
#   path: outputs/only_new.txt        # Относительный путь рядом с YAML.
#   encoding: utf-16                  # Например, UTF-16 для отдельного потребителя.
#   overwrite: true                   # Атомарно заменить старый output новыми строками.
#
# Разово путь можно не менять в YAML:
#   passgen from-config my_passgen.yaml --output outputs/other.txt --yes
# Флаг --force также разово включает overwrite, а --stats печатает статистику.
