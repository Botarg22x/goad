name: diplom-gitlab-lab

services:
  gitlab:
    # Фиксированная версия нужна, чтобы стенд и его резервная копия совпадали.
    image: gitlab/gitlab-ce:19.6.1-ce.0
    hostname: gitlab.test
    restart: "no"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.test:8082'
        # 8082 внутри контейнера занят Sidekiq exporter; веб-сервер слушает 80.
        nginx['listen_port'] = 80
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
        letsencrypt['enable'] = false
    ports:
      - "127.0.0.1:8082:80"
    shm_size: "256m"
    volumes:
      - config:/etc/gitlab
      - logs:/var/log/gitlab
      - data:/var/opt/gitlab

volumes:
  config:
  logs:
  data:
